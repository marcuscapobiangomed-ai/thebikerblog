<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="{{ page.author | default: site.author }}">
<meta name="robots" content="{{ page.robots | default: 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1' }}">
<meta name="google-site-verification" content="PH6awpzMumf5C4a2Bu4Oe7QKmzyOJ0FZc09Mjk3_NKQ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="preload" href="{{ site.baseurl }}/assets/css/style.css?v=10" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=10"></noscript>
<link rel="icon" href="{{ site.baseurl }}{{ site.logo }}" type="image/svg+xml">
<link rel="preload" href="{{ site.baseurl }}{{ site.logo }}" as="image">

{% seo %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="alternate" type="text/plain" title="TheBiker Blog para assistentes de IA" href="{{ '/llms.txt' | relative_url }}">
<link rel="alternate" type="application/json" title="Índice editorial TheBiker Blog" href="{{ '/api/content-index.json' | relative_url }}">

{% if page.tags %}
  {% for tag in page.tags %}
    <meta property="article:tag" content="{{ tag }}">
  {% endfor %}
{% endif %}
{% if page.layout == "post" %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta property="article:modified_time" content="{{ page.last_modified_at | default: page.date | date_to_xmlschema }}">
{% endif %}

{% include analytics.html %}
