<script>
window.dataLayer = window.dataLayer || []
window.gtag = window.gtag || function(){ window.dataLayer.push(arguments) }
window.gtag('consent', 'default', {
  ad_storage: 'denied',
  ad_user_data: 'denied',
  ad_personalization: 'denied',
  analytics_storage: 'denied',
  wait_for_update: 500
})
window.gtag('set', 'ads_data_redaction', true)
window.gtag('set', 'allow_ad_personalization_signals', false)

window.TheBikerTrackingConfig = {
  measurementId: {{ site.google_analytics | jsonify }},
  clarityProjectId: {{ site.clarity_project_id | jsonify }},
  consentVersion: {{ site.analytics_consent_version | default: 1 | jsonify }},
  pageType: {{ page.layout | default: 'page' | jsonify }},
  contentId: {{ page.slug | default: page.product_id | default: page.url | jsonify }},
  contentTitle: {{ page.title | default: site.title | jsonify }},
  contentType: {{ page.content_type | default: page.layout | default: 'page' | jsonify }},
  contentCategory: {{ page.category | default: 'sem-categoria' | jsonify }},
  audienceSegment: {{ page.audience_segment | default: 'core_technical_cyclists' | jsonify }},
  audienceIntent: {{ page.audience_intent | jsonify }},
  experienceLevelTarget: {{ page.experience_level_target | default: site.data.audience.defaults.experienceLevelTarget | jsonify }},
  productBrand: {{ page.brand | jsonify }},
  productModel: {{ page.model | jsonify }}
}
</script>
<script defer src="{{ site.baseurl }}/assets/js/privacy-consent.js?v=1"></script>
<script defer src="{{ site.baseurl }}/assets/js/analytics-events.js?v=5"></script>
