name: TheBiker — Automação editorial

on:
  schedule:
    - cron: "5 9,13,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validar a próxima pauta sem chamar as APIs"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: thebiker-editorial-write
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: bot
      - name: Validar fila e configuração estrutural
        run: npm run automation:doctor
        working-directory: bot
      - name: Revalidar disponibilidade do catálogo TheBiker
        run: npm run catalog:revalidate
      - name: Preparar derivados e validar baseline antes de consumir IA
        run: npm run validate:ci

  generate-draft:
    needs: preflight
    if: ${{ vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: editorial-automation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: bot
      - name: Revalidar disponibilidade do catálogo TheBiker
        run: npm run catalog:revalidate
      - name: Revalidar baseline no workspace de produção
        run: npm run validate:ci
      - name: Atualizar catálogo visual oficial da TheBiker
        run: npm run media:discover && npm run media:audit
        working-directory: bot
      - name: Recuperar ou substituir a próxima pauta bloqueada
        env:
          CAMPAIGN_RESEARCH_MAX_ATTEMPTS: "2"
        run: npm run campaign:recover
        working-directory: bot
      - name: Auditar buffer legado ainda sem nota final
        id: buffer_audit
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '5.00' }}
          DEEPSEEK_FLASH_MODEL: ${{ vars.DEEPSEEK_FLASH_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_PRO_MODEL: ${{ vars.DEEPSEEK_PRO_MODEL || 'deepseek-v4-pro' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run campaign:audit-buffer
        working-directory: bot
      - name: Pesquisar, produzir e revisar no máximo uma pauta
        id: automation
        continue-on-error: true
        env:
          AUTOMATION_ENABLED: "true"
          AUTOMATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          CAMPAIGN_CURATED_OFFLINE_FALLBACK: "true"
          AI_DETERMINISTIC_CURATED_FALLBACK: "true"
          AI_PIPELINE_MODE: three-provider
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '5.00' }}
          DEEPSEEK_FLASH_MODEL: ${{ vars.DEEPSEEK_FLASH_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_PRO_MODEL: ${{ vars.DEEPSEEK_PRO_MODEL || 'deepseek-v4-pro' }}
          AI_HTTP_TIMEOUT_MS: ${{ vars.AI_HTTP_TIMEOUT_MS || '120000' }}
          AI_HTTP_RETRY_ATTEMPTS: ${{ vars.AI_HTTP_RETRY_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_ATTEMPTS: ${{ vars.AI_FINAL_REPAIR_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_TIMEOUT_MS: ${{ vars.AI_FINAL_REPAIR_TIMEOUT_MS || '75000' }}
          DEEPSEEK_MAX_TOKENS: ${{ vars.DEEPSEEK_MAX_TOKENS || '14000' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'groq' }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-3.6-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run campaign:produce
        working-directory: bot
      - name: Substituir artigo reprovado e tentar pauta-reserva
        id: automation_retry
        if: steps.automation.outcome == 'failure' && (github.event_name == 'schedule' || inputs.dry_run == false)
        continue-on-error: true
        env:
          AUTOMATION_ENABLED: "true"
          AUTOMATION_DRY_RUN: "false"
          CAMPAIGN_RESEARCH_MAX_ATTEMPTS: "2"
          CAMPAIGN_CURATED_OFFLINE_FALLBACK: "true"
          AI_DETERMINISTIC_CURATED_FALLBACK: "true"
          AI_PIPELINE_MODE: three-provider
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '5.00' }}
          DEEPSEEK_FLASH_MODEL: ${{ vars.DEEPSEEK_FLASH_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_PRO_MODEL: ${{ vars.DEEPSEEK_PRO_MODEL || 'deepseek-v4-pro' }}
          AI_HTTP_TIMEOUT_MS: ${{ vars.AI_HTTP_TIMEOUT_MS || '120000' }}
          AI_HTTP_RETRY_ATTEMPTS: ${{ vars.AI_HTTP_RETRY_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_ATTEMPTS: ${{ vars.AI_FINAL_REPAIR_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_TIMEOUT_MS: ${{ vars.AI_FINAL_REPAIR_TIMEOUT_MS || '75000' }}
          DEEPSEEK_MAX_TOKENS: ${{ vars.DEEPSEEK_MAX_TOKENS || '14000' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'groq' }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-3.6-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run campaign:recover && npm run campaign:produce
        working-directory: bot
      - name: Produzir imagem e agendar pauta validada
        id: finalization
        if: steps.automation.outcome == 'success' || steps.automation_retry.outcome == 'success'
        continue-on-error: true
        run: npm run campaign:finalize
        working-directory: bot
      - name: Recompor pauta-reserva apÃ³s falha de finalizaÃ§Ã£o
        id: finalization_retry
        if: steps.finalization.outcome == 'failure' && (github.event_name == 'schedule' || inputs.dry_run == false)
        continue-on-error: true
        env:
          AUTOMATION_ENABLED: "true"
          AUTOMATION_DRY_RUN: "false"
          CAMPAIGN_RESEARCH_MAX_ATTEMPTS: "2"
          CAMPAIGN_CURATED_OFFLINE_FALLBACK: "true"
          AI_DETERMINISTIC_CURATED_FALLBACK: "true"
          AI_PIPELINE_MODE: three-provider
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '5.00' }}
          DEEPSEEK_FLASH_MODEL: ${{ vars.DEEPSEEK_FLASH_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_PRO_MODEL: ${{ vars.DEEPSEEK_PRO_MODEL || 'deepseek-v4-pro' }}
          AI_HTTP_TIMEOUT_MS: ${{ vars.AI_HTTP_TIMEOUT_MS || '120000' }}
          AI_HTTP_RETRY_ATTEMPTS: ${{ vars.AI_HTTP_RETRY_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_ATTEMPTS: ${{ vars.AI_FINAL_REPAIR_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_TIMEOUT_MS: ${{ vars.AI_FINAL_REPAIR_TIMEOUT_MS || '75000' }}
          DEEPSEEK_MAX_TOKENS: ${{ vars.DEEPSEEK_MAX_TOKENS || '14000' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'groq' }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-3.6-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run campaign:replenish -- --target-buffer=1 --max-attempts=2
        working-directory: bot
      - name: Verificar links TheBiker após as transformações
        if: steps.automation.outcome == 'success' || steps.automation_retry.outcome == 'success'
        run: npm run check:thebiker-links
      - name: Validar artefatos produzidos
        id: validation
        if: always()
        run: npm run validate
      - name: Persistir somente candidato integralmente validado
        if: (steps.automation.outcome == 'success' || steps.automation_retry.outcome == 'success') && (steps.finalization.outcome == 'success' || steps.finalization_retry.outcome == 'success') && steps.validation.outcome == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          git config user.name "thebiker-editorial-bot"
          git config user.email "thebiker-editorial-bot@users.noreply.github.com"
          git add _data/products/bikes _posts bot/editorial-campaign.json _data/editorial-calendar.json _data/catalog-public.json api/products.json content/research/campaign assets/img/posts content/image-library/index.json bot/operational-state
          git diff --cached --quiet || git commit -m "content: produzir próxima pauta da campanha"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Persistir candidato revisado para retomar finalização
        if: always() && (steps.automation.outcome == 'success' || steps.automation_retry.outcome == 'success') && steps.finalization.outcome == 'failure' && steps.finalization_retry.outcome != 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          git config user.name "thebiker-editorial-bot"
          git config user.email "thebiker-editorial-bot@users.noreply.github.com"
          git add -- bot/editorial-campaign.json _data/editorial-calendar.json _posts/drafts content/research/campaign
          git diff --cached --quiet || git commit -m "state: preservar candidato revisado para retomada"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Persistir somente estado seguro da falha
        if: always() && ((steps.automation.outcome == 'failure' && steps.automation_retry.outcome != 'success') || (steps.finalization.outcome == 'failure' && steps.finalization_retry.outcome != 'success')) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          git config user.name "thebiker-editorial-bot"
          git config user.email "thebiker-editorial-bot@users.noreply.github.com"
          git add -- bot/editorial-campaign.json _data/editorial-calendar.json bot/operational-state/editorial-exceptions.json
          git diff --cached --quiet || git commit -m "state: registrar falha editorial tipada"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Propagar falha da produção
        if: steps.automation.outcome == 'failure' && steps.automation_retry.outcome != 'success'
        run: exit 1
      - name: Propagar falha de finalização
        if: steps.finalization.outcome == 'failure' && steps.finalization_retry.outcome != 'success'
        run: exit 1
      - name: Resumo operacional
        if: always()
        run: |
          echo "### Automação editorial TheBiker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Produção: ${{ steps.automation.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pauta-reserva: ${{ steps.automation_retry.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Finalização: ${{ steps.finalization.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failover da finalização: ${{ steps.finalization_retry.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validação transacional: ${{ steps.validation.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auditoria do buffer: ${{ steps.buffer_audit.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  disabled-notice:
    needs: preflight
    if: ${{ vars.AUTOMATION_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automação editorial validada, porém pausada pela variável AUTOMATION_ENABLED."
