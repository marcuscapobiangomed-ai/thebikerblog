name: TheBiker - Alertas operacionais

on:
  workflow_run:
    workflows:
      - "TheBiker — Automação editorial"
      - "TheBiker — Publicação diária ao meio-dia"
      - "TheBiker — Auditoria final do buffer"
      - "TheBiker — Reparo editorial do buffer"
      - "TheBiker — Renovação mensal de 30 dias"
      - "TheBiker — Inteligência SEO e YouTube"
      - "TheBiker — Watchdog editorial diário"
      - "TheBiker — Atualização diária de corridas"
      - "Deploy Blog"
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = '[AUTO] Falha operacional no blog TheBiker';
            const body = `Falha em **${run.name}** (${run.head_sha.slice(0, 7)}). [Abrir execucao](${run.html_url}).`;
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const issue = data.find((entry) => entry.title === title);
            if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
