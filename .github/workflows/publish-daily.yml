name: TheBiker — Publicação diária ao meio-dia

on:
  schedule:
    # 11:55, 12:00 e 12:10 em Brasilia; publicar e idempotente.
    - cron: "55 14 * * *"
    - cron: "0 15 * * *"
    - cron: "10 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas verificar o post agendado"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: thebiker-editorial-write
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: editorial-automation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: bot
      - name: Revalidar disponibilidade do catálogo TheBiker
        run: npm run catalog:revalidate
      - name: Preparar derivados e validar baseline antes de publicar
        run: npm run validate:ci
      - name: Garantir artigo aprovado para hoje antes da promoção
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          AUTOMATION_ENABLED: "true"
          AUTOMATION_DRY_RUN: "false"
          CAMPAIGN_RESEARCH_MAX_ATTEMPTS: "2"
          CAMPAIGN_CURATED_OFFLINE_FALLBACK: "true"
          AI_DETERMINISTIC_CURATED_FALLBACK: "true"
          AI_PIPELINE_MODE: three-provider
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '5.00' }}
          DEEPSEEK_FLASH_MODEL: ${{ vars.DEEPSEEK_FLASH_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_PRO_MODEL: ${{ vars.DEEPSEEK_PRO_MODEL || 'deepseek-v4-pro' }}
          AI_HTTP_TIMEOUT_MS: ${{ vars.AI_HTTP_TIMEOUT_MS || '120000' }}
          AI_HTTP_RETRY_ATTEMPTS: ${{ vars.AI_HTTP_RETRY_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_ATTEMPTS: ${{ vars.AI_FINAL_REPAIR_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_TIMEOUT_MS: ${{ vars.AI_FINAL_REPAIR_TIMEOUT_MS || '75000' }}
          DEEPSEEK_MAX_TOKENS: ${{ vars.DEEPSEEK_MAX_TOKENS || '14000' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'groq' }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-3.6-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          today="$(TZ=America/Sao_Paulo date +%F)"
          npm run campaign:replenish -- --target-buffer=1 --max-attempts=3 --required-date="$today"
        working-directory: bot
      - name: Publicar somente o conteúdo aprovado para hoje
        id: publication
        env:
          AUTOMATION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          result="$(node src/publish_scheduled.js)"
          echo "$result"
          echo "status=$(echo "$result" | jq -r .status)" >> "$GITHUB_OUTPUT"
        working-directory: bot
      - name: Validar conteúdo e calendário
        run: npm run validate
      - name: Registrar publicação
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          git config user.name "thebiker-editorial-bot"
          git config user.email "thebiker-editorial-bot@users.noreply.github.com"
          git add _data/products/bikes _posts bot/editorial-campaign.json _data/editorial-calendar.json _data/catalog-public.json api/products.json
          git diff --cached --quiet || git commit -m "publish: artigo diário $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Disparar deploy da publicação confirmada
        if: ${{ steps.publication.outputs.status == 'published' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
