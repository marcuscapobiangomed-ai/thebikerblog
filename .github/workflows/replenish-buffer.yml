name: TheBiker — Recomposição automática do buffer editorial

on:
  schedule:
    # Executa antes e entre as janelas de produção; o grupo único serializa
    # qualquer disputa com produção/publicação diária.
    - cron: "15 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      target_buffer:
        description: "Quantidade mínima de pautas futuras em scheduled"
        required: false
        default: "7"
        type: string
      max_attempts:
        description: "Máximo de ciclos de produção por execução"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: thebiker-editorial-write
  cancel-in-progress: false

jobs:
  replenish:
    if: ${{ vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: editorial-automation
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: bot
      - name: Revalidar catálogo e baseline antes de consumir IA
        run: npm run catalog:revalidate && npm run validate:ci
      - name: Recompor pautas futuras sem relaxar gates
        id: replenish
        continue-on-error: true
        env:
          AUTOMATION_ENABLED: "true"
          AUTOMATION_DRY_RUN: "false"
          CAMPAIGN_RESEARCH_MAX_ATTEMPTS: "2"
          AI_PIPELINE_MODE: three-provider
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD || '5.00' }}
          DEEPSEEK_FLASH_MODEL: ${{ vars.DEEPSEEK_FLASH_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_PRO_MODEL: ${{ vars.DEEPSEEK_PRO_MODEL || 'deepseek-v4-pro' }}
          AI_HTTP_TIMEOUT_MS: ${{ vars.AI_HTTP_TIMEOUT_MS || '120000' }}
          AI_HTTP_RETRY_ATTEMPTS: ${{ vars.AI_HTTP_RETRY_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_ATTEMPTS: ${{ vars.AI_FINAL_REPAIR_ATTEMPTS || '2' }}
          AI_FINAL_REPAIR_TIMEOUT_MS: ${{ vars.AI_FINAL_REPAIR_TIMEOUT_MS || '75000' }}
          DEEPSEEK_MAX_TOKENS: ${{ vars.DEEPSEEK_MAX_TOKENS || '14000' }}
          RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'groq' }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-3.6-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run campaign:replenish -- --target-buffer=${{ inputs.target_buffer || '7' }} --max-attempts=${{ inputs.max_attempts || '3' }} --allow-partial
        working-directory: bot
      - name: Validar e persistir cada avanço seguro
        if: always()
        run: |
          validation_status=0
          npm run validate || validation_status=$?
          git config user.name "thebiker-editorial-bot"
          git config user.email "thebiker-editorial-bot@users.noreply.github.com"
          git add _posts/drafts content/research/campaign assets/img/posts content/image-library/index.json bot/editorial-campaign.json bot/operational-state _data/editorial-calendar.json _data/catalog-public.json api/products.json
          git diff --cached --quiet || git commit -m "state: recompor buffer editorial"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit $validation_status
      - name: Propagar erro inesperado de recomposição
        if: steps.replenish.outcome == 'failure'
        run: exit 1
      - name: Resumo do buffer
        if: always()
        run: |
          echo "### Recomposição automática do buffer" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: ${{ steps.replenish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- A execução é parcial por desenho; o artigo só entra em scheduled após todos os gates." >> "$GITHUB_STEP_SUMMARY"

