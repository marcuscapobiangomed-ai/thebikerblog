name: Validate Images

on:
  pull_request:
    paths:
      - "_posts/**"
      - "assets/img/posts/**"
      - "bot/editorial-campaign.json"
      - "bot/config/official-image-sources.json"
      - "bot/src/images/**"
      - "bot/src/validation/**"
      - "content/product-discovery/thebiker-media-catalog.json"
      - "scripts/audit-media-catalog.js"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Install site validation dependencies
        run: npm ci

      - name: Install image validation dependencies
        run: npm ci
        working-directory: bot

      - name: Validate post images
        run: npm run media:audit && node scripts/validate-images.js
