name: Validar Conteúdo (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "_posts/**"
      - "_data/**"
      - "content/research/**"
      - "assets/img/posts/**"
      - "assets/js/**"
      - "_includes/**"
      - "_layouts/**"
      - "legal/**"
      - "index.html"
      - "bot/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "api/**"
      - "bot/editorial-campaign.json"
      - "_data/editorial-calendar.json"
      - "llms.txt"
      - "robots.txt"
      - "_config.yml"
      - "_redirects.yml"

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            bot/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Instalar Dependências
        run: npm ci
        working-directory: bot

      - name: Preparar artefatos derivados temporais
        run: npm run prepare:derived

      - name: Bloquear credenciais no repositorio
        run: npm run security:secrets

      - name: Lint (JS)
        run: |
          node --check src/schemas/research.schema.js
          node --check src/schemas/product-knowledge.schema.js
          node --check src/knowledge/product-knowledge.js
          node --check src/schemas/article.schema.js
          node --check src/validation/validate-research.js
          node --check src/validation/validate-scheduled-publications.js
          node --check src/validation/validate-images.js
          node --check src/validation/check-claims.js
          node --check src/generator.js
          node --check src/cron_post.js
          node --check src/automation/queue.js
          node --check src/automation/doctor.js
          node --check src/automation/campaign.js
          node --check src/publish_scheduled.js
          node --check src/automation/grounded-research.js
          node --check src/campaign_producer.js
          node --check src/campaign_finalize.js
          node --check src/images/campaign-cover.js
        working-directory: bot

      - name: Validar automação editorial
        run: npm run automation:doctor
        working-directory: bot

      - name: Validar Fichas de Pesquisa
        run: node src/validation/validate-research.js
        working-directory: bot

      - name: Validar buffer agendado para publicação
        run: npm run validate:scheduled
        working-directory: bot

      - name: Verificar Alegações Proibidas
        run: node src/validation/check-claims.js
        working-directory: bot

      - name: Validar Posts
        run: node src/validate_posts.js
        working-directory: bot

      - name: Validar Imagens
        run: node src/validation/validate-images.js
        working-directory: bot

      - name: Validar consistência entre imagem e artigo
        run: npm run validate:images

      - name: Validar Base de Dados (schemas)
        run: node _data/schemas/validate-all.js

      - name: Verificar sincronização das páginas de produto
        run: npm run check:product-pages

      - name: Verificar catálogo público TheBiker
        run: npm run check:catalog-public

      - name: Verificar taxonomia de tags
        run: npm run check:tags

      - name: Verificar lotes e endpoints para máquinas
        run: npm run check:machine-readable

      - name: Audit technical SEO
        run: npm run audit:seo

      - name: Validate analytics tracking and n8n exports
        run: |
          npm run test:analytics
          npm run check:n8n

      - name: Check for fictional authorship
        run: |
          ! grep -r "Sergio Arantes" _posts/ --include="*.md" && echo "OK" || (echo "ERRO: autoria fictícia encontrada"; exit 1)

      - name: Check for missing source sections
        run: |
          for f in _posts/*.md; do
            if ! grep -qi "## Fontes\|## Referências" "$f"; then
              echo "AVISO: $f não tem seção de fontes"
            fi
          done

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Validate AI discovery artifact
        run: npm run validate:ai-build

      - name: Bloquear credenciais no site gerado
        run: npm run security:public
