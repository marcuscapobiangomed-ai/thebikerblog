title: "TheBiker Insights"
tagline: "Ciclismo vivido, testado e explicado"
description: "O canal editorial oficial da TheBiker: análises técnicas, comparativos, lançamentos e cobertura de competições para ciclistas experientes"
url: "https://blog.thebiker.com.br"
baseurl: ""
lang: pt-BR

author: "Equipe TheBiker"
email: "atendimento@thebiker.com.br"

organization:
  name: "TheBiker"
  url: "https://thebikershop.com.br/"
  same_as:
    - "https://www.instagram.com/thebikerbrasil"

logo: "/assets/img/logo.svg"

social:
  name: TheBiker Insights
  links:
    - https://www.instagram.com/thebikerbrasil

webmaster_verifications:
  google: googleae077bce8e335daa

google_analytics: G-DHD86P6XDZ
clarity_project_id: "xyo6bi7k8g"
analytics_consent_version: 1

markdown: kramdown
highlighter: rouge

permalink: /:year/:month/:title/

# Metadados extras por post (usado no redesign)
# Adicionar nos posts: reading_time, image, image_alt, image_credit

defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      author: "Equipe TheBiker"
  - scope:
      path: "_posts"
      type: posts
    values:
      image: /assets/img/logo.svg

exclude:
  # Operação, governança e evidências ficam no repositório, não no índice público.
  - admin
  - audit
  - bot
  - content
  - data-room
  - docs
  - node_modules
  - output
  - project
  - screenshots
  - screenshots-v2
  - sql
  - vendor
  - ARQUIVO.md
  - PLANO.md
  - SECURITY.md
  - design-qa.md
  - design-qa-navigation-option-2.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - scripts

paginate: 10
paginate_path: "/page/:num/"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
